[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-trading-engine"
version = "0.1.0"
description = "Research-first intraday trading engine for NSE equities using Upstox market data."
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1", "pandas>=2.2", "numpy>=2.0", "requests>=2.32",
  "python-dotenv>=1.0", "scikit-learn>=1.5", "joblib>=1.4", "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
