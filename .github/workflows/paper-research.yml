name: Paper Research Cycle

on:
  workflow_dispatch:
  schedule:
    # 09:00 IST, Monday-Friday. Scheduled workflows use the default branch.
    - cron: '0 9 * * 1-5'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read
  actions: read

# Every research/paper_session.py invocation runs for 1-4 hours straight
# with no TTY attached, so Python fully block-buffers stdout by default --
# a real run showed every print() from a multi-hour step landing in the log
# in one burst at process exit. Unbuffered output means a hang or a crash
# partway through still leaves a live, inspectable log instead of nothing.
env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: paper-research-cycle
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: pip install -e .

      # The Parquet warehouse (intraday_engine/storage/warehouse) is durable
      # cross-day state. It is never committed to git -- it lives as a GitHub
      # Actions artifact today (interim; the persist/restore code only knows
      # about a local directory, so swapping this for real object storage
      # later is a workflow change, not a research-logic change). A missing
      # artifact is only expected on the very first run ever; anything else
      # (corrupt/incompatible warehouse) must fail the job, not proceed silently.
      - name: Locate latest warehouse artifact
        id: warehouse_lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/warehouse
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '[.artifacts[] | select(.name == "warehouse" and .expired == false)] | sort_by(.created_at) | last | .id // empty')
          echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found existing warehouse artifact id=${ARTIFACT_ID}"
          else
            echo "No existing warehouse artifact found -- treating this as the first run"
          fi

      - name: Download and restore warehouse
        if: steps.warehouse_lookup.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/${{ steps.warehouse_lookup.outputs.artifact_id }}/zip" > warehouse.zip
          unzip -q warehouse.zip -d data/warehouse
          rm warehouse.zip
          python -m scripts.warehouse_restore --root data/warehouse --target data/trading.duckdb

      # scripts.backfill needs instrument_master populated to resolve symbols
      # to instrument keys; on a fresh/restored database this hasn't happened
      # yet (the daily bootstrap below also syncs, but only after backfill
      # would otherwise need to run). Cheap and idempotent (upsert).
      - name: Sync instrument universe
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.sync_instruments

      # The scanner's candidate scoring caps any symbol's score at 9.999 until
      # it has >= lookback_days (20) of prior daily candle history -- without
      # this, every candidate is capped and scores stop differentiating
      # anything (see the Phase 8 readiness review). insert_candles() dedupes
      # by timestamp, so re-running this every day is safe and cheap; it keeps
      # a rolling ~30-day history topped up even if the warehouse is ever
      # restored from an older or partial state.
      - name: Backfill rolling 30-day candle history
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.backfill --universe --days 30

      - name: Run paper daily bootstrap
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.daily_cycle

      - name: Run morning paper session
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.paper_session --interval 5 --until 12:00 --no-bootstrap

      # Both the growing DuckDB *and* the (mostly-unchanged) warehouse
      # directory travel to the afternoon job together, so the afternoon
      # job's persist step can skip every partition that hasn't changed
      # today instead of re-exporting the whole history from scratch.
      - name: Upload midday state
        uses: actions/upload-artifact@v4
        with:
          name: paper-midday-state
          path: |
            data/trading.duckdb
            data/warehouse
          retention-days: 2
          if-no-files-found: error

  afternoon:
    needs: morning
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: pip install -e .

      - name: Download midday state
        uses: actions/download-artifact@v4
        with:
          name: paper-midday-state
          path: data

      - name: Run afternoon paper session
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.paper_session --interval 5 --until 15:30 --no-bootstrap

      - name: Finalize outcomes and export research journal
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python -m scripts.paper_close --output research_data

      # Turns today's newly-EVALUATED paper observations into point-in-time
      # feature snapshots + training labels (idempotent -- already-processed
      # observations are skipped every time). No model training happens here.
      - name: Build learning data (feature snapshots + training labels)
        run: python -m scripts.build_learning_data

      # Aggregate diagnostics over everything evaluated so far (idempotent --
      # a no-op if nothing new was evaluated today). Never trains a model,
      # never touches strategy/signal logic; only reports what the
      # accumulated sample currently supports and flags what's too small to
      # trust yet.
      - name: Run research diagnostics
        run: python -m scripts.run_diagnostics_report

      # Reads accumulated ingestion_runs/data_quality_events/paper_observations/
      # research_diagnostics history and fails the job if ingestion has failed
      # on several consecutive runs in a row -- catches a pipeline that has
      # been silently degraded for days even though no single run crashed
      # loudly enough on its own to be noticed. Never touches strategy logic.
      - name: Run pipeline health monitoring
        run: python -m scripts.run_monitoring_report

      # Convenience only, not the durable store: a short-lived, human-readable
      # copy of today's CSV/JSON export for quick inspection. Never committed
      # to git -- the warehouse (below) is what actually needs to survive.
      - name: Upload today's research journal (short-lived, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: research-journal-${{ github.run_id }}
          path: research_data
          retention-days: 14
          if-no-files-found: warn

      # Incremental: partitions whose row count already matches the manifest
      # carried over from the morning job are left untouched, so only today's
      # data is actually written and re-checksummed.
      - name: Persist to warehouse
        run: python -m scripts.warehouse_persist --root data/warehouse --source data/trading.duckdb

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: data/warehouse
          retention-days: 90
          if-no-files-found: error
